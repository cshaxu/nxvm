name: shared-library

on:
  push:
    paths:
      - 'src/lib/**'
      - '.github/workflows/lib.yml'
  pull_request:
    paths:
      - 'src/lib/**'
      - '.github/workflows/lib.yml'

jobs:
  library-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure standalone library
        run: cmake -G Ninja -S src/lib -B build/lib
      - name: Verify complete manifest
        run: cmake --build build/lib --target lib-verify-manifest
      - name: Build selected platform library
        run: cmake --build build/lib --config Release
      - name: Run standalone library tests
        run: ctest --test-dir build/lib --output-on-failure

  library-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone library
        run: cmake -G Ninja -S src/lib -B build/lib
      - name: Verify complete manifest
        run: cmake --build build/lib --target lib-verify-manifest
      - name: Build selected platform library
        run: cmake --build build/lib --config Release
      - name: Run standalone library tests
        run: ctest --test-dir build/lib --output-on-failure
